spring.application.name=api-gateway
server.port=8080

# Configuración de Eureka Client
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}

# Logging para debug
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty=DEBUG
logging.level.com.netflix.eureka=DEBUG
logging.level.com.netflix.discovery=DEBUG

# Configuración de CORS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*

# Configuración de Actuator
management.endpoints.web.exposure.include=health,info,gateway,metrics
management.endpoint.gateway.enabled=true
management.endpoint.health.show-details=always
management.endpoint.info.enabled=true

# Información de la aplicación para /actuator/info
info.app.name=API Gateway Microservicios
info.app.description=Gateway para enrutamiento de peticiones a microservicios - Proyecto Udemy
info.app.version=1.0.0
info.app.author=NameYohell
info.app.environment=docker
info.app.port=8080
info.microservices.usuarios=http://micro-usuarios:8081
info.microservices.direcciones=http://micro-direcciones:8082
info.eureka.server=http://eureka-server:8761
info.database.type=MySQL
info.database.port=3306

# Habilitar información adicional en /actuator/info
management.info.env.enabled=true
management.info.java.enabled=true
management.info.build.enabled=true

# Configuración de Timeouts
spring.cloud.gateway.httpclient.connect-timeout=1000
spring.cloud.gateway.httpclient.response-timeout=5s